<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneShift AI - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
        #results { margin-top: 20px; padding: 20px; background: #f5f5f5; }
        #emotionResults, #rewriteResults, #suggestions { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🎭 ToneShift AI - Frontend Test</h1>
    
    <div class="test-section">
        <h2>Test Emotion Analysis</h2>
        <button onclick="testEmotionAnalysis()">Test Emotion Analysis</button>
        <div id="test-results"></div>
    </div>
    
    <div id="results" class="results" style="display: none;">
        <div id="emotionResults"></div>
        <div id="rewriteResults"></div>
        <div id="suggestions"></div>
    </div>

    <script>
        function testEmotionAnalysis() {
            const testData = {
                emotion_analysis: {
                    emotion: "happy",
                    confidence: 0.85,
                    all_emotions: {
                        happy: 0.85,
                        surprised: 0.10,
                        neutral: 0.05
                    }
                },
                suggestions: ["Great job!", "Keep it up!"]
            };
            
            console.log('Testing emotion analysis display...');
            displayEmotionResults(testData);
        }
        
        function displayEmotionResults(data) {
            const resultsDiv = document.getElementById('results');
            const emotionDiv = document.getElementById('emotionResults');
            
            if (!resultsDiv) {
                console.error('Results div not found');
                document.getElementById('test-results').innerHTML = '<div class="error">❌ Results div not found</div>';
                return;
            }
            
            if (!emotionDiv) {
                console.error('Emotion results div not found');
                document.getElementById('test-results').innerHTML = '<div class="error">❌ Emotion results div not found</div>';
                return;
            }
            
            resultsDiv.style.display = 'block';
            
            // Handle both direct API response and WebSocket response
            const emotionAnalysis = data.emotion_analysis || data;
            const primaryEmotion = emotionAnalysis.emotion;
            const confidence = ((emotionAnalysis.confidence || 0) * 100).toFixed(1);
            
            emotionDiv.innerHTML = `
                <h3>Emotion Analysis</h3>
                <div class="emotion-display">
                    <div class="emotion-tag" style="background: #667eea; color: white; padding: 10px; border-radius: 5px; display: inline-block;">
                        ${primaryEmotion.charAt(0).toUpperCase() + primaryEmotion.slice(1)} (${confidence}%)
                    </div>
                </div>
            `;
            
            if (data.suggestions && data.suggestions.length > 0) {
                const suggestionsDiv = document.getElementById('suggestions');
                if (suggestionsDiv) {
                    suggestionsDiv.innerHTML = `
                        <h4>Suggestions:</h4>
                        ${data.suggestions.map(s => `<div class="suggestion" style="background: white; padding: 10px; margin: 5px 0; border-radius: 5px;">${s}</div>`).join('')}
                    `;
                }
            }
            
            document.getElementById('test-results').innerHTML = '<div class="success">✅ Emotion analysis display working correctly!</div>';
        }
    </script>
</body>
</html>
